apply plugin: 'com.android.application'
apply from: project(':libaxmol').projectDir.toString() + "/../dsl/axmol.gradle"

// Resolve build profiles
def buildProfiles = AxmolUtils.resolveBuildProfiles(project)

android {
    def packageName = buildProfiles['packageName']
    def cmakeVer = buildProfiles['cmakeVer']
    def cmakeOptions = Eval.me(buildProfiles['cmakeOptions'])
    def minSdk = buildProfiles['minSdk']
    def targetSdk = buildProfiles['targetSdk']

    // Apply build profiles
    namespace = packageName
    compileSdk = targetSdk.toInteger()
    ndkVersion = buildProfiles['ndkVer']
    if(buildProfiles.containsKey('ndkPath')) {
        ndkPath = buildProfiles['ndkPath']
    }

    defaultConfig {
        applicationId packageName
        minSdkVersion minSdk
        targetSdkVersion targetSdk
        versionCode 5
        versionName "1.3.0"
        resourceConfigurations += ['en']

        externalNativeBuild {
            cmake {
                arguments = []
                arguments.addAll(cmakeOptions)
                cppFlags "-frtti -fexceptions -fsigned-char"
            }
        }

        ndk {
            // noinspection ChromeOsAbiSupport
            abiFilters = __1K_ARCHS.split(':').collect{it as String}
        }
    }

    sourceSets.main {
        java.srcDir "src"
        res.srcDir "res"
        manifest.srcFile "AndroidManifest.xml"
        assets.srcDir "build/assets"
    }

    externalNativeBuild {
        cmake {
            version = cmakeVer
            path "../../CMakeLists.txt"
        }
    }

    // Release signing: proj.android/keystore.properties (git-ignored), or -PKEY_STORE_FILE=... on the command line
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file("keystore.properties")
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    def signingProp = { String name -> keystoreProps.getProperty(name) ?: (project.hasProperty(name) ? project.property(name) : null) }

    signingConfigs {
       release {
            if (signingProp("KEY_STORE_FILE")) {
                storeFile rootProject.file(signingProp("KEY_STORE_FILE"))
                storePassword signingProp("KEY_STORE_PASSWORD")
                keyAlias signingProp("KEY_ALIAS")
                keyPassword signingProp("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            proguardFile file(project(':libaxmol').projectDir.toString() + '/proguard-rules.pro')
            if (signingProp("KEY_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            debuggable true
            jniDebuggable true
        }
    }

    aaptOptions {
       noCompress 'mp3','ogg','wav','mp4','ttf','ttc','otf'
    }

    buildFeatures {
        aidl = true
    }
}

android.applicationVariants.configureEach { variant ->
    def variantName = variant.name.capitalize()
    tasks.register("copy${variantName}ContentToAssets") {
        doFirst {
            delete "${projectDir}/build/assets"
        }
        doLast {
            copy {
                from "${projectDir}/../../Content"
                into "${projectDir}/build/assets"
                exclude "**/*.gz", "**/.DS_Store", "**/.dummy", "**/README.md", "**/*.md"
            }
            copy {
                from "${projectDir}/build/runtime/axslc"
                into "${projectDir}/build/assets/axslc"
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':libaxmol')
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'   // GDPR / US-state consent form (AdMob policy)
    implementation 'com.android.billingclient:billing:8.3.0'

    // Play Console flags outdated SDKs, including transitive ones (e.g. androidx.fragment:fragment:1.1.0 via
    // play-services-basement). Constraints raise those transitive versions without adding direct dependencies.
    constraints {
        implementation('androidx.fragment:fragment:1.8.9') { because 'play-services-basement pulls in fragment 1.1.0 (outdated SDK warning)' }
        implementation('androidx.activity:activity:1.10.1') { because 'transitive activity 1.2.3 is outdated' }
        implementation('androidx.core:core:1.16.0') { because 'transitive core 1.8.0 is outdated' }
        implementation('androidx.core:core-ktx:1.16.0') { because 'keep in sync with androidx.core:core' }
        implementation('androidx.lifecycle:lifecycle-runtime:2.8.7') { because 'transitive lifecycle 2.3.1 is outdated' }
        implementation('androidx.lifecycle:lifecycle-common:2.8.7') { because 'keep in sync with lifecycle-runtime' }
        implementation('androidx.lifecycle:lifecycle-viewmodel:2.8.7') { because 'keep in sync with lifecycle-runtime' }
        implementation('androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7') { because 'keep in sync with lifecycle-runtime' }
        implementation('androidx.lifecycle:lifecycle-livedata:2.8.7') { because 'keep in sync with lifecycle-runtime' }
        implementation('androidx.lifecycle:lifecycle-livedata-core:2.8.7') { because 'keep in sync with lifecycle-runtime' }
        implementation('androidx.lifecycle:lifecycle-service:2.8.7') { because 'keep in sync with lifecycle-runtime' }
        implementation('androidx.savedstate:savedstate:1.2.1') { because 'transitive savedstate 1.1.0 is outdated' }
        implementation('androidx.exifinterface:exifinterface:1.4.1') { because 'media3 pulls in exifinterface 1.3.6' }
    }
}

project.afterEvaluate {
    android.applicationVariants.configureEach { variant ->
        def variantName = variant.name.capitalize()
        def copyTask = tasks.named("copy${variantName}ContentToAssets")

        // !!!IMPORTANT: This copy task must depend on the native build task.
        // Without this dependency, the copy step may run before native libraries
        // are built, resulting in incomplete or outdated assets being packaged
        // into the APK. Do not remove or modify this dependency, as it ensures
        // the correct build order: native build -> copy assets -> merge assets -> AAB/APK.
        copyTask.configure {
            dependsOn(tasks.named("externalNativeBuild${variantName}"))
        }

        tasks.named("merge${variantName}Assets").configure {
            dependsOn(copyTask)
        }
    }
}
