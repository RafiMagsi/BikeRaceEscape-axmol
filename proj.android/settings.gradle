import java.nio.file.Paths

def folder = new File("${settingsDir}/../axmol")
if (folder.exists()) {
    System.setProperty("AX_ROOT", folder.path)
} else {
    def axRoot = System.env.AX_ROOT
    // The iOS build uses the project's own engine copy (thirdparty/axmol). Android is built and signed with the
    // shared engine, so an AX_ROOT left pointing at the iOS copy (e.g. exported in the same terminal) is ignored.
    def sharedEngine = new File("${System.getProperty('user.home')}/development/axmol")
    if (axRoot != null && axRoot.contains("/thirdparty/axmol") && sharedEngine.exists()) {
        println "AX_ROOT points at the iOS engine copy (${axRoot}); using ${sharedEngine.path} for Android"
        axRoot = sharedEngine.path
    }
    System.setProperty("AX_ROOT", "${axRoot}")
}

include ':libaxmol'
project(':libaxmol').projectDir = new File(Paths.get("${System.properties.AX_ROOT}/core/platform/android/libaxmol").toUri())
include ':BikeRaceEscapeAxmol'
project(':BikeRaceEscapeAxmol').projectDir = new File(settingsDir, 'app')
rootProject.name = "BikeRaceEscapeAxmol"
